<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#FF8E53"/>
      <stop offset="100%" stop-color="#FFA07A"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE66D"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner decorative circles -->
  <circle cx="80" cy="80" r="40" fill="#ffffff" opacity="0.12"/>
  <circle cx="430" cy="120" r="50" fill="#ffffff" opacity="0.12"/>
  <circle cx="410" cy="420" r="60" fill="#ffffff" opacity="0.12"/>
  <circle cx="90" cy="400" r="45" fill="#ffffff" opacity="0.12"/>

  <!-- Playful Center Badge -->
  <circle cx="256" cy="240" r="140" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Smiling Star Character -->
  <path d="M256,140 L278,206 L348,206 L292,246 L314,312 L256,272 L198,312 L220,246 L164,206 L234,206 Z" fill="url(#starGrad)" filter="url(#shadow)"/>
  
  <!-- Star Eyes -->
  <ellipse cx="242" cy="235" rx="5" ry="7" fill="#2C3E50"/>
  <ellipse cx="270" cy="235" rx="5" ry="7" fill="#2C3E50"/>
  <circle cx="240" cy="233" r="2" fill="#ffffff"/>
  <circle cx="268" cy="233" r="2" fill="#ffffff"/>

  <!-- Star Smile -->
  <path d="M244,250 Q256,262 268,250" fill="none" stroke="#E67E22" stroke-width="4" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <circle cx="234" cy="250" r="5" fill="#FF8A80" opacity="0.6"/>
  <circle cx="278" cy="250" r="5" fill="#FF8A80" opacity="0.6"/>

  <!-- Arabic Typography "عالم أكرم" -->
  <rect x="76" y="380" width="360" height="74" rx="37" fill="#ffffff" filter="url(#shadow)"/>
  <text x="256" y="430" font-family="'Cairo', system-ui, sans-serif" font-size="38" font-weight="900" fill="#E84118" text-anchor="middle">عالم أكرم</text>
</svg>
