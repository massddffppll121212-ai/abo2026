name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء (debug أو release أو both)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

jobs:
  build-android:
    name: Build Unsigned Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 6. Install Dependencies & Build Web App
        run: |
          npm ci || npm install
          npm run build

      - name: 7. Prepare Capacitor Android Project (if missing)
        run: |
          if [ ! -d "android" ]; then
            echo "Initializing Capacitor Android project..."
            npm install --no-save @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0
            if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
              npx cap init "عالم أكرم" "com.akramworld.app" --web-dir dist
            fi
            npx cap add android
            MANIFEST="android/app/src/main/AndroidManifest.xml"
            if [ -f "$MANIFEST" ] && ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
              sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />|' "$MANIFEST"
            fi
          else
            npm install --no-save @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0
            npx cap sync android
          fi

      - name: 8. Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 9. Build Debug APK (assembleDebug)
        if: ${{ github.event.inputs.build_type != 'release' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 10. Build Unsigned Release APK (assembleRelease - No Signing)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 11. Upload Debug APK Artifact
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: AkramWorld-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: 12. Upload Unsigned Release APK Artifact
        if: ${{ github.event.inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: AkramWorld-Unsigned-Release-APK
          path: android/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: warn
